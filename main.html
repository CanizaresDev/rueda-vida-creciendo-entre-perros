<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --cream:#FAF6EE;
    --cream-deep:#EFE8D7;
    --paper:#FFFCF4;
    --mint:#7FBFAE;
    --mint-dark:#5FA694;
    --mint-soft:#B8DCD2;
    --coral:#ED9079;
    --coral-dark:#D77559;
    --coral-soft:#F5C2B0;
    --sand:#D7C9A8;
    --ink:#3A3A3A;
    --ink-soft:#6B6555;
    --grid:#D8D4CC;
    --line:#CDC8BB;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0;
    background: var(--cream-deep);
    font-family:'Nunito', system-ui, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(127,191,174,0.18), transparent 30%),
      radial-gradient(circle at 88% 92%, rgba(237,144,121,0.16), transparent 32%),
      var(--cream-deep);
    min-height:100vh;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 14px 12px 130px;
  }

  /* ===== CARD (downloaded artifact) ===== */
  .card{
    background: var(--paper);
    border-radius: 14px;
    padding: 14px 14px 18px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.07);
    position: relative;
    overflow: hidden;
  }

  /* Decorative top/bottom borders — original geometric pattern */
  .deco{
    height: 22px;
    display:flex;
    justify-content: space-around;
    align-items:flex-end;
    padding: 0 4px;
    overflow:hidden;
  }
  .deco.bottom{ align-items: flex-start; transform: scaleY(-1); }
  .deco i{ display:inline-block; }
  .d-arc{ width:14px; height:7px; border-radius: 14px 14px 0 0; }
  .d-dot{ width:8px; height:8px; border-radius:50%; }
  .d-half{ width:14px; height:7px; border-radius: 14px 14px 0 0; }
  .d-leaf{ width:10px; height:14px; border-radius: 50% 50% 0 50%; transform: rotate(-30deg); }
  .d-tri{ width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent; border-bottom: 9px solid; }

  .title{
    font-family:'Patrick Hand', cursive;
    text-align:center;
    font-size: 26px;
    line-height: 1.05;
    letter-spacing: 0.5px;
    margin: 8px 6px 2px;
    color: var(--ink);
  }
  .title .small{
    display:block;
    font-size:14px;
    letter-spacing:3px;
    color: var(--mint-dark);
    margin-bottom: 2px;
    text-transform: uppercase;
    font-family:'Nunito', sans-serif;
    font-weight:700;
  }

  /* ===== Radar chart ===== */
  .chart-wrap{
    width:100%;
    margin: 0 auto;

<script>
/* ============================================================
   Categorías y descripciones (placeholders — reemplazables)
   ============================================================ */
const CATS = [
  { id: 'autonomia',     name: 'AUTONOMÍA',                angle: 22.5,  label: ['AUTONOMÍA'] },
  { id: 'recursos',      name: 'RECURSOS',                 angle: 67.5,  label: ['RECURSOS'] },
  { id: 'socializacion', name: 'SOCIALIZACIÓN Y PASEOS',   angle: 112.5, label: ['SOCIALIZACIÓN', 'Y PASEOS'] },

  { id: 'juego',         name: 'JUEGO',                    angle: 337.5, label: ['JUEGO'] },
];

const DESCRIPTIONS = {
  autonomia: {
    measures: 'La capacidad del perro para tomar pequeñas decisiones y tolerar estar solo o separado brevemente de sus humanos.',
    ranges: [
      { range: '1-3',  text: 'Sufre ansiedad al quedarse solo, persigue constantemente a la familia.' },
      { range: '4-6',  text: 'Puede estar solo unos minutos en otra habitación, pero se inquieta rápido.' },
      { range: '7-10', text: 'Se queda tranquilo en su cama o espacio sin mostrar estrés, aunque esté solo.' }
    ]
  },
  recursos: {
    measures: 'El acceso y la variedad de recursos (agua, comida, camas, juguetes) y si los usa de forma apropiada.',
    ranges: [
      { range: '1-3',  text: 'Tiene pocos juguetes y opciones de entretenimiento/estimulación, no usa/no tiene cama o refugio, recurso vital (agua/comida) irregular. Presenta agresividad por protección de recursos.' },
      { range: '4-6',  text: 'Dispone de recursos básicos, pero de forma limitada o con poca variedad. Protege los recursos, pero sin entrar en conflicto.' },
      { range: '7-10', text: 'Múltiples camas, agua fresca, alimentación de calidad y juguetes que cubren todas sus motivaciones.' }
    ]
  },
  socializacion: {
    measures: 'La calidad y frecuencia de sus interacciones fuera de casa: paseos, materiales de paseo, salidas higiénicas y encuentros con otros perros/personas.',
    ranges: [
      { range: '1-3',  text: 'Sale muy poco, paseos estresantes o inexistentes. No disfruta de las salidas. No usa material adecuado.' },
      { range: '4-6',  text: 'Paseos breves e irregulares; pocas oportunidades de socializar.' },
      { range: '7-10', text: 'Buenas salidas diarias (higiénicas + distendidas), material adecuado y tiempo para correr o interactuar.' }
    ]
  },
  salud: {
    measures: 'El estado físico y emocional del perro: revisiones veterinarias, ausencia de dolor o patologías, estrés.',
    ranges: [
      { range: '1-3',  text: 'Problemas de salud sin atender, estrés sostenido, desparasitación irregular, mala alimentación.' },
      { range: '4-6',  text: 'Revisiones esporádicas, desbordes emocionales puntuales pero con vuelta a la normalidad en menos de 5 minutos, molestias o patologías controladas (no dolor). Alimentación acorde.' },
      { range: '7-10', text: 'Chequeos regulares, buena nutrición, sin estrés y sin signos de malestar.' }
    ]
  },
  calma: {
    measures: 'La capacidad de tolerar la frustración y mantener un estado de reposo sin excesiva excitación.',
    ranges: [
      { range: '1-3',  text: 'Nervioso todo el día, bucles de insistencia, difícil de relajar.' },
      { range: '4-6',  text: 'Momentos de calma breve seguidos de picos de energía o tensión.' },
      { range: '7-10', text: 'Se mantiene tranquilo buena parte del tiempo, responde positivamente a entornos relajantes.' }

  amor: {
    measures: 'La fortaleza del apego mutuo: frecuencia y calidad de las muestras de afecto y seguridad emocional.',

      { range: '1-3',  text: 'Escaso contacto afectivo, dudas sobre la conexión emocional.' },
      { range: '4-6',  text: 'Momentos de cariño intermitentes; el perro busca afecto, pero con inseguridad.' },

    measures: 'La sensación de protección y seguridad en el hogar y en entornos nuevos; confianza en sus humanos como base.',

      { range: '1-3',  text: 'Inseguro con ruidos o cambios, no recurre al humano en apuros.' },
      { range: '4-6',  text: 'A veces busca compañía, pero reacciona con miedo ante estímulos moderados.' },
      { range: '7-10', text: 'Se siente protegido, explora con confianza, acude a sus referentes si algo le inquieta.' }
    ]
  },
  juego: {
    measures: 'La frecuencia e iniciativa de comportamientos lúdicos (solo, con humanos o con otros animales).',
    ranges: [
      { range: '1-3',  text: 'Casi no juega, falta de motivación.' },
      { range: '4-6',  text: 'Juega ocasionalmente, necesita estímulo externo para participar. Demanda con mucha frecuencia y se frustra si no juegas con él.' },
      { range: '7-10', text: 'Juega diariamente de forma autónoma y/o en interacción social, entiende cuándo termina el juego.' }
    ]
  }
};

/* ============================================================
   Estado
   ============================================================ */
const STORE_KEY = 'rueda-vida-perro-v1';
const DEFAULTS = {
  values: { autonomia:7, recursos:7, socializacion:6, salud:5, calma:6, amor:7, seguridad:7, juego:7 },
  parent: '', dog: '', date: '', notes: ''
};
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULTS));
    const s = JSON.parse(raw);
    return {
      values: { ...DEFAULTS.values, ...(s.values||{}) },
      parent: s.parent ?? '',
      dog: s.dog ?? '',
      date: s.date ?? '',
      notes: s.notes ?? ''
    };
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULTS)); }
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

/* ============================================================
   Radar SVG render
   ============================================================ */
const SVG_NS = 'http://www.w3.org/2000/svg';
const CX = 300, CY = 310;
const R = 175;

function pt(angleDeg, radius){
  const a = angleDeg * Math.PI / 180;
  return [CX + radius * Math.sin(a), CY - radius * Math.cos(a)];
}
function el(name, attrs={}, content){
  const node = document.createElementNS(SVG_NS, name);
  for(const k in attrs){ node.setAttribute(k, attrs[k]); }
  if(content !== undefined) node.textContent = content;
  return node;
}

function renderRadar(){
  const svg = document.getElementById('radar');
  svg.innerHTML = '';

  // Concentric circles (10 rings)
  for(let i=1;i<=10;i++){
    const rad = R * i / 10;
    const c = el('circle', {
      cx:CX, cy:CY, r: rad,
      class: 'grid-circle' + (i % 2 === 0 ? ' alt' : '')
    });
    if(i===10) c.setAttribute('class', 'grid-outer');
    svg.appendChild(c);
  }

  // 8 axis lines
  CATS.forEach(c => {
    const [x,y] = pt(c.angle, R);
    svg.appendChild(el('line', { x1:CX, y1:CY, x2:x, y2:y, class:'axis' }));
  });

  // central vertical & horizontal cross (subtle)
  svg.appendChild(el('line', { x1:CX, y1:CY-R, x2:CX, y2:CY+R, class:'axis-cross' }));
  svg.appendChild(el('line', { x1:CX-R, y1:CY, x2:CX+R, y2:CY, class:'axis-cross' }));

  // Scale numbers (1 to 10) on the central vertical, going up
  for(let i=1;i<=10;i++){
    const y = CY - (R * i / 10) + 4;
    svg.appendChild(el('text', {
      x: CX + 7, y: y,
      class:'scale-num',
      'font-family': 'Nunito, sans-serif',
      'font-size': '10'
    }, String(i)));
  }

  // Data polygon
  const dataPts = CATS.map(c => {
    const v = state.values[c.id];
    const [x,y] = pt(c.angle, R * v / 10);
    return [x,y];
  });
  svg.appendChild(el('polygon', {
    points: dataPts.map(p=>p.join(',')).join(' '),
    class: 'data-poly'
  }));

  // Data dots
  dataPts.forEach(([x,y]) => {
    svg.appendChild(el('circle', { cx:x, cy:y, r:5.5, class:'data-dot' }));
  });

  // Labels (multi-line) + invisible tap target
  CATS.forEach(c => {
    const lineCount = c.label.length;
    const lblPad = lineCount > 1 ? 28 : 22;
    const [lx, ly] = pt(c.angle, R + lblPad);
    const [axX] = pt(c.angle, R);

    let anchor;
    const dx = axX - CX;
    if (Math.abs(dx) < 6) anchor = 'middle';
    else if (dx > 0) anchor = 'start';
    else anchor = 'end';

    c.label.forEach((line, i) => {
      const yOff = (i - (lineCount - 1)/2) * 17;
      const t = el('text', {
        x: lx, y: ly + yOff,
        'text-anchor': anchor,
        'dominant-baseline': 'middle',
        class: 'cat-label',
        'data-cat': c.id,
        'font-family': 'Patrick Hand, cursive',
        'font-size': '15',
        'letter-spacing': '1.4'
      }, line);
      svg.appendChild(t);
    });

    // tap circle
    const hitR = lineCount > 1 ? 56 : 40;
    const hit = el('circle', {
      cx: lx, cy: ly, r: hitR,
      class:'cat-hit',
      'data-cat': c.id
    });
    svg.appendChild(hit);
  });

  // wire up taps
  svg.querySelectorAll('[data-cat]').forEach(node => {
    node.addEventListener('click', e => {
      e.stopPropagation();
      openModal(node.getAttribute('data-cat'));
    });
  });
}

/* ============================================================
   Modal
   ============================================================ */
const modal = document.getElementById('modal');
const mTitle = document.getElementById('mTitle');
const mDesc  = document.getElementById('mDesc');
const mNum   = document.getElementById('mNum');
const mSlider= document.getElementById('mSlider');
let activeCat = null;

function updateSliderFill(v){
  const pct = ((v - 1) / 9) * 100;
  mSlider.style.setProperty('--p', pct + '%');
  mNum.textContent = v;
}

function openModal(catId){
  const cat = CATS.find(c => c.id === catId);
  if(!cat) return;
  activeCat = catId;
  mTitle.textContent = cat.name;
  const d = DESCRIPTIONS[catId];
  if(d){
    let html = '';
    if(d.measures){
      html += `<p class="measures"><b>¿Qué mide?</b> ${escapeHtml(d.measures)}</p>`;
    }
    if(d.ranges && d.ranges.length){
      html += '<ul class="ranges">';
      d.ranges.forEach(r => {
        html += `<li><span class="rg">${escapeHtml(r.range)}</span><span>${escapeHtml(r.text)}</span></li>`;
      });
      html += '</ul>';
    }
    mDesc.innerHTML = html;
  } else {
    mDesc.textContent = '';
  }
  const v = state.values[catId];
  mSlider.value = v;
  updateSliderFill(v);
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function closeModal(){
  modal.classList.remove('open');
  document.body.style.overflow = '';
  activeCat = null;
}

mSlider.addEventListener('input', e => updateSliderFill(+e.target.value));
document.getElementById('mPlus').addEventListener('click', () => {
  const v = Math.min(10, +mSlider.value + 1);
  mSlider.value = v; updateSliderFill(v);
});
document.getElementById('mMinus').addEventListener('click', () => {
  const v = Math.max(1, +mSlider.value - 1);
  mSlider.value = v; updateSliderFill(v);
});
document.getElementById('mSave').addEventListener('click', () => {
  if(activeCat){
    state.values[activeCat] = +mSlider.value;
    saveState();
    renderRadar();
  }
  closeModal();
});
document.getElementById('mCancel').addEventListener('click', closeModal);
modal.addEventListener('click', e => {
  if(e.target === modal) closeModal();
});

/* ============================================================
   Form bindings
   ============================================================ */
const fParent = document.getElementById('parent');
const fDog    = document.getElementById('dog');
const fDate   = document.getElementById('date');
const fNotes  = document.getElementById('notes');

fParent.value = state.parent || '';
fDog.value    = state.dog    || '';
fDate.value   = state.date   || '';
fNotes.value  = state.notes  || '';

[ ['parent', fParent], ['dog', fDog], ['date', fDate], ['notes', fNotes] ].forEach(([k, n]) => {
  n.addEventListener('input', () => { state[k] = n.value; saveState(); });
});

/* ============================================================
   Reset
   ============================================================ */
document.getElementById('btnReset').addEventListener('click', () => {
  if(!confirm('¿Reiniciar todos los valores a 5?')) return;
  CATS.forEach(c => { state.values[c.id] = 5; });
  saveState();
  renderRadar();
});

/* ============================================================
   Download as PNG (html2canvas)
   ============================================================ */
const btnDownload = document.getElementById('btnDownload');
btnDownload.addEventListener('click', async () => {
  const card = document.getElementById('card');
  btnDownload.disabled = true;
  btnDownload.textContent = 'Preparando…';

  // Hide non-capture elements & switch placeholders off
  const hideEls = card.querySelectorAll('[data-no-capture]');
  hideEls.forEach(n => n.style.visibility = 'hidden');
  card.classList.add('capturing');

  // Make sure fonts are ready and painted
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e) {}
  await new Promise(r => setTimeout(r, 500));

  try{
    const canvas = await html2canvas(card, {
      backgroundColor: null,
      scale: Math.min(3, (window.devicePixelRatio||1) * 2),
      useCORS: true,
      allowTaint: true,
      logging: false,
      onclone: async (doc) => {
        try { await doc.fonts.ready; } catch(e) {}
      }
    });
    const filename = buildFilename();
    canvas.toBlob(blob => {
      if(!blob){ showToast('No se pudo generar la imagen'); restore(); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 1000);
      showToast('Imagen guardada');
      restore();
    }, 'image/png');
  }catch(err){
    console.error(err);
    showToast('Error generando imagen');
    restore();
  }

  function restore(){
    hideEls.forEach(n => n.style.visibility = '');
    card.classList.remove('capturing');
    btnDownload.disabled = false;
    btnDownload.textContent = 'Descargar imagen';
  }
});

function buildFilename(){
  const slug = (s) => (s||'').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const parts = ['rueda-vida'];
  if(state.dog) parts.push(slug(state.dog));
  if(state.date) parts.push(state.date);
  return parts.filter(Boolean).join('_') + '.png';
}

/* ============================================================
   Toast
   ============================================================ */
const toast = document.getElementById('toast');
let toastT;
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(()=> toast.classList.remove('show'), 2200);
}

/* ============================================================
   Init
   ============================================================ */
renderRadar();
</script>
<script>
function checkPassword(){
  if(_pwdReal === 'PCM'){
    document.getElementById('pwd-overlay').classList.add('hidden');
  } else {
    document.getElementById('pwd-error').textContent = 'Contraseña incorrecta. Inténtalo de nuevo.';
    document.getElementById('pwd-input').value = '';
    _pwdReal = '';
    document.getElementById('pwd-input').focus();
  }
}
// Custom password masking to avoid browser-forced colors on Android
let _pwdReal = '';
const _pwdEl = document.getElementById('pwd-input');
_pwdEl.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ checkPassword(); return; }
});
_pwdEl.addEventListener('input', function(e){
  const dots = this.value;
  const prev = _pwdReal;
  if(dots.length > prev.length){
    // characters added
    const added = dots.slice(prev.length).replace(/●/g, '');
    _pwdReal = prev + added;
  } else {
    // characters removed
    _pwdReal = prev.slice(0, dots.length);
  }
  // replace display with dots
  const pos = this.selectionStart;
  this.value = '●'.repeat(_pwdReal.length);
  try { this.setSelectionRange(pos, pos); } catch(e){}
});

document.getElementById('dog').addEventListener('input', function(){
  const name = this.value.trim();
  document.getElementById('title-dog').textContent = name ? 'de ' + name : 'del perro';
});
</script>
